# ============================================================
# 五十心所 · 每日省察 —— GitHub Actions 自动部署
#
# 触发：push 到 main 分支（或手动触发）后，自动部署到 Cloudflare Pages
# 前置条件（首次使用需在 GitHub 仓库 Settings → Secrets and variables → Actions 配置）：
#   CLOUDFLARE_API_TOKEN  Cloudflare API 令牌（需含 Cloudflare Pages: Edit 权限）
#   CLOUDFLARE_ACCOUNT_ID Cloudflare 账户 ID（dash.cloudflare.com 右侧可见）
#
# 若你的 Cloudflare Pages 项目名不同，请修改下方 --project-name 的值。
# ============================================================
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=mind --branch=main --commit-dirty=true
